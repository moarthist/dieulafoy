<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jane Dieulafoy: The Photographs</title>
  <meta name="description" content="A micro museum of Jane Dieulafoy's photograph albums (INHA, Paris), in six virtual rooms.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/museum.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='24' font-family='Georgia' font-size='22' fill='%23f4f1ec' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="bar" id="bar">
    <a class="mark" href="#/">Dieulafoy<span>Photographs</span></a>
    <nav class="bar-rooms" id="bar-rooms" aria-label="Rooms"></nav>
    <a class="bar-link" href="#/walk">Walk in 3D</a>
    <a class="bar-link" href="#/albums">Albums</a>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-title">
    <div class="v-stage">
      <div class="v-osd" id="v-osd"></div>
      <div class="v-tools">
        <button type="button" data-v="zoomin" aria-label="Zoom in">+</button>
        <button type="button" data-v="zoomout" aria-label="Zoom out">&minus;</button>
        <button type="button" data-v="home" aria-label="Fit to screen">&#9634;</button>
      </div>
      <button type="button" class="v-nav v-prev" data-v="prev" aria-label="Previous">&larr;</button>
      <button type="button" class="v-nav v-next" data-v="next" aria-label="Next">&rarr;</button>
    </div>
    <aside class="v-panel">
      <button type="button" class="v-close" data-v="close" aria-label="Close">&times;</button>
      <p class="v-room" id="v-room"></p>
      <h2 id="v-title"></h2>
      <dl class="v-meta" id="v-meta"></dl>
      <div class="v-actions" id="v-actions"></div>
      <p class="v-count" id="v-count"></p>
    </aside>
  </div>

  <script src="vendor/openseadragon.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
