<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jane Dieulafoy: A Catalogue of the Photographs</title>
  <meta name="description" content="A catalogue of Jane Dieulafoy's photographs, in the manner of an old printed catalogue: 774 numbered plates from the Dieulafoy albums of the INHA library, Paris, in six chapters.">
  <meta name="theme-color" content="#2e2a26">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/catalogue.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233a2f26'/%3E%3Ctext x='16' y='24' font-family='Georgia' font-size='22' fill='%23e8d9b5' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="top-title" href="#p0"><span class="sc">Dieulafoy</span> <em>Catalogue of the Photographs</em></a>
    <nav class="top-nav" aria-label="Catalogue">
      <button type="button" class="tbtn" data-go="contents">Contents</button>
      <button type="button" class="tbtn" data-act="search">Search</button>
      <a class="tbtn" href="study.html">The study in 3D</a>
    </nav>
  </header>

  <main class="desk" id="desk">
    <div class="book" id="book" aria-live="polite">
      <div class="edge edge-l" aria-hidden="true"></div>
      <div class="edge edge-r" aria-hidden="true"></div>
      <div class="slot slot-l" id="slot-l"></div>
      <div class="slot slot-r" id="slot-r"></div>
      <div class="ribbon" aria-hidden="true"></div>
      <button type="button" class="turn-zone tz-prev" data-act="prev" aria-label="Previous page"></button>
      <button type="button" class="turn-zone tz-next" data-act="next" aria-label="Next page"></button>
    </div>
  </main>

  <footer class="bar" role="toolbar" aria-label="Pages">
    <button type="button" class="tbtn arrow" data-act="prev" aria-label="Previous page">‹</button>
    <label class="scrub"><span class="sr">Go to page</span><input type="range" id="scrub" min="0" value="0"></label>
    <span class="folio" id="folio"></span>
    <button type="button" class="tbtn arrow" data-act="next" aria-label="Next page">›</button>
  </footer>

  <div class="sheet" id="search" hidden role="dialog" aria-label="Search the catalogue">
    <div class="sheet-card">
      <button type="button" class="sheet-close" data-act="close-search" aria-label="Close">✕</button>
      <p class="kicker">Search the catalogue</p>
      <label><span class="sr">Search captions</span><input type="search" id="q" placeholder="Ispahan, pont, derviche, frise, Salamanque…" autocomplete="off"></label>
      <p class="hits" id="hits"></p>
      <ol class="results" id="results"></ol>
    </div>
  </div>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-title">
    <div class="v-stage">
      <div class="v-osd" id="v-osd"></div>
      <div class="v-tools">
        <button type="button" data-v="zoomin" aria-label="Zoom in">+</button>
        <button type="button" data-v="zoomout" aria-label="Zoom out">&minus;</button>
        <button type="button" data-v="home" aria-label="Fit to screen">&#9634;</button>
      </div>
      <button type="button" class="v-nav v-prev" data-v="prev" aria-label="Previous plate">&larr;</button>
      <button type="button" class="v-nav v-next" data-v="next" aria-label="Next plate">&rarr;</button>
    </div>
    <aside class="v-panel">
      <button type="button" class="sheet-close" data-v="close" aria-label="Close">✕</button>
      <p class="kicker" id="v-no"></p>
      <h2 id="v-title"></h2>
      <dl class="v-meta" id="v-meta"></dl>
      <div class="v-actions" id="v-actions"></div>
    </aside>
  </div>

  <noscript><p class="noscript">This catalogue needs JavaScript to turn its pages.</p></noscript>
  <script src="vendor/openseadragon.min.js"></script>
  <script type="module" src="js/catalogue.js"></script>
</body>
</html>
